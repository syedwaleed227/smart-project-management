# All-in-one deployment for a NAS (Synology Container Manager / QNAP Container Station)
# or any Docker host. Runs BOTH the database and the web app as containers.
#
# Settings are read from a `.env` file placed next to this file (see .env.nas.example).
# Database files are stored in ./data/postgres on the NAS so they sit inside your
# shared folder and are covered by the NAS's own RAID + backup.
services:
  db:
    image: postgres:16-alpine
    container_name: accounting_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: accounting_suite
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting -d accounting_suite"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: accounting_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://accounting:${DB_PASSWORD:-changeme}@db:5432/accounting_suite?schema=public"
      AUTH_SECRET: ${AUTH_SECRET:-please-change-this-long-secret}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-4-8}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@firm.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
    ports:
      - "${APP_PORT:-3000}:3000"
